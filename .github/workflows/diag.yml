# 一時的な診断用（手動実行のみ）
name: diag-yahoo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose
        run: |
          mkdir -p out
          python - <<'PY'
          import json, datetime
          import yfinance as yf, pandas as pd
          res = {"utc_now": datetime.datetime.utcnow().isoformat()}
          def tail(df, n=3):
              if df is None or len(df) == 0: return None
              d = df.tail(n).copy()
              if isinstance(d.columns, pd.MultiIndex): d.columns = ["|".join(map(str, c)) for c in d.columns]
              return d.reset_index().astype(str).to_dict("records")
          res["dl_SPY_5d"] = tail(yf.download("SPY", period="5d", interval="1d", auto_adjust=False, progress=False, group_by="ticker"))
          res["hist_SPY_5d"] = tail(yf.Ticker("SPY").history(period="5d", interval="1d", auto_adjust=False))
          res["hist_SPY_5d_raw"] = tail(yf.Ticker("SPY").history(period="5d", interval="1d", auto_adjust=False, repair=False, keepna=True))
          res["dl_SPY_start"] = tail(yf.download("SPY", start="2026-10-21", end="2026-10-29", interval="1d", auto_adjust=False, progress=False, group_by="ticker"))
          res["hist_NVDA_5d"] = tail(yf.Ticker("NVDA").history(period="5d", interval="1d", auto_adjust=False))
          h = yf.Ticker("SPY").history(period="2d", interval="1h")
          res["hist_SPY_1h_tail"] = tail(h, 8)
          try:
              res["fast_info"] = {k: str(yf.Ticker("SPY").fast_info[k]) for k in ["last_price", "previous_close", "open", "day_high", "day_low", "last_volume"]}
          except Exception as e:
              res["fast_info_error"] = repr(e)[:200]
          json.dump(res, open("out/diag.json", "w"), indent=1, ensure_ascii=False, default=str)
          PY
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && git init -q && git checkout -q -b diag
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m diag && git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" diag
