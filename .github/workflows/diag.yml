# 一時的な診断用（手動実行のみ）。Yahooから最新の日足が取れるかを確かめ、結果を diag ブランチに置く。
name: diag-yahoo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose
        run: |
          mkdir -p out
          python - <<'PY'
          import json, datetime
          import yfinance as yf, pandas as pd
          import fetch_data as fd
          res = {"utc_now": datetime.datetime.utcnow().isoformat(), "yfinance": yf.__version__}
          raw = yf.download(["SPY", "QQQ", "^VIX", "NVDA"], period="3y", interval="1d", auto_adjust=False, actions=False, group_by="ticker", threads=True, progress=False)
          res["raw_tail_SPY"] = raw["SPY"].tail(3).reset_index().astype(str).to_dict("records")
          res["raw_tail_VIX"] = raw["^VIX"].tail(3).reset_index().astype(str).to_dict("records")
          tickers = fd.read_tickers("tickers.txt")
          px, failed = fd.download(tickers[:40], "3y")
          res["long_last_dates"] = px.groupby("ticker")["date"].max().value_counts().to_dict()
          res["long_SPY_tail"] = px[px["ticker"] == "SPY"].tail(3).astype(str).to_dict("records")
          res["unclosed"] = fd.unclosed_session_date()
          json.dump(res, open("out/diag.json", "w"), indent=1, ensure_ascii=False, default=str)
          PY
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && git init -q && git checkout -q -b diag
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m diag && git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" diag
