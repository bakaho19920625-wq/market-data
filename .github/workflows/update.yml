# 米国株データを毎日自動で取得し、「data」ブランチに最新版だけを保存する
name: update-market-data

on:
  schedule:
    # 月〜金の 22:17 UTC ＝ 日本時間 火〜土の朝 7:17（米国の取引終了後）
    - cron: "17 22 * * 1-5"
  workflow_dispatch: # 「Run workflow」ボタンで手動実行もできる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch data
        run: python fetch_data.py --out out

      - name: Publish to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git checkout -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
