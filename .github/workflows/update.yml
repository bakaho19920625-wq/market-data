# 米国株データを毎日自動で取得・解析し、「data」ブランチに最新版だけを保存する
name: update-market-data

on:
  schedule:
    # 米国の取引終了後に何度か試す（GitHubの予約実行は数時間遅れることがあるため）。
    # 月〜金 21:45・22:45・23:45 UTC、火〜土 0:45・1:45 UTC（日本時間 6:45〜10:45）。
    # 何度動いても同じ基準日のデータを上書きするだけ。未確定の当日分は fetch_data.py が除く。
    - cron: "45 21,22,23 * * 1-5"
    - cron: "45 0,1 * * 2-6"
  workflow_dispatch: # 「Run workflow」ボタンで手動実行もできる

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Keep the schedule alive
        # 公開リポジトリは60日間活動がないと自動実行が止まる。毎回「有効化」を呼んで予防する。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable"; then
            echo "KEEPALIVE_STATUS=ok" >> "$GITHUB_ENV"
          else
            echo "KEEPALIVE_STATUS=failed" >> "$GITHUB_ENV"
          fi

      - name: Fetch previous ledger
        # 前回の台帳（セットアップ登録・ブレイク追跡・レジーム履歴）を引き継ぐ
        run: |
          mkdir -p out/prev
          if git fetch origin data:data-prev 2>/dev/null; then
            git show data-prev:ledger.json > out/prev/ledger.json || echo "no previous ledger"
          else
            echo "no data branch yet"
          fi

      - name: Fetch data
        run: python fetch_data.py --out out

      - name: Analyze
        run: python analyze.py --out out --prev-ledger out/prev/ledger.json

      - name: Publish to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -rf prev
          git init -q
          git checkout -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
