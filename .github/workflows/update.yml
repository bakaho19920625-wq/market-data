# 米国株データを毎日自動で取得・解析し、「data」ブランチに最新版だけを保存する
name: update-market-data

on:
  schedule:
    # 実績（2026-10-27〜31の実行ログ）に合わせた時刻。
    # ・Yahooは引け後しばらくは前日分の日足を返すが、米国東部 20:30〜21:20 ごろ（時間外取引の終了後の再計算）に
    #   全銘柄の終値が一時的に空欄になり、21:25〜22:10 ごろに戻る。以前の予約（UTC 21:45〜）はGitHubの遅れで
    #   ちょうどこの空欄の時間帯（日本時間 10:00〜10:20）に動いていたため、毎朝前日のままだった。
    # ・GitHubの予約は毎時45分・00分付近で数時間遅れ、同じ時刻帯の複数行は1回にまとめられることがある。
    # そこで、(1) 引け直後（東部 16:35＝日本 6:35。遅れても 20:00 までは安全）、(2) 空欄の時間帯が終わった後（東部 22:35＝日本 12:35）、
    # (3) 夕方の保険（日本 15:35）の3回だけにし、各回は「前営業日の足が入るまで10分おきに最大6回取り直す」（下の Fetch data）。
    # 分は :35 にして混雑する :00／:45 を避ける。月〜金 21:35 UTC ＝ 火〜土 6:35 JST、火〜土 3:35・6:35 UTC ＝ 12:35・15:35 JST。
    # 米国が夏時間の間（3月中旬〜11月上旬）は東部時間が1時間ずれるが、取り直しで吸収する。
    # GitHub の予約実行は遅れたり飛んだりすることがある（2026-11-02 21:35Z の回が動かなかった）ので、各回の15分後に予備を置く。
    # concurrency で直列に動き、データが最新なら1回目の取得で終わる
    - cron: "35 21 * * 1-5"
    - cron: "50 21 * * 1-5"
    - cron: "35 3,6 * * 2-6"
    - cron: "50 3,6 * * 2-6"
  workflow_dispatch: # 「Run workflow」ボタンで手動実行もできる

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Keep the schedule alive
        # 公開リポジトリは60日間活動がないと自動実行が止まる。毎回「有効化」を呼んで予防する。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable"; then
            echo "KEEPALIVE_STATUS=ok" >> "$GITHUB_ENV"
          else
            echo "KEEPALIVE_STATUS=failed" >> "$GITHUB_ENV"
          fi

      - name: Fetch previous ledger
        # 前回の台帳（セットアップ登録・ブレイク追跡・レジーム履歴）を引き継ぐ
        run: |
          mkdir -p out/prev
          if git fetch origin data:data-prev 2>/dev/null; then
            git show data-prev:ledger.json > out/prev/ledger.json || echo "no previous ledger"
            git show data-prev:manifest.json > out/prev/manifest.json || echo "no previous manifest"
            git show data-prev:screen.csv > out/prev/screen.csv || echo "no previous screen"
            git show data-prev:history_signals.csv > out/prev/history_signals.csv || echo "no previous history"
          else
            echo "no data branch yet"
          fi

      - name: Fetch data
        # 前営業日（東部16:20を過ぎた直近の平日）の足が入るまで、10分おきに最大6回取り直す。
        # Yahooが終値を空欄で返す時間帯（東部 20:30〜21:20 ごろ）に当たった場合の対策。休場日は6回待って前回の足のまま進む。
        run: |
          python - <<'PY'
          import json, subprocess, sys, time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          def expected_session():
              now = datetime.now(ZoneInfo("America/New_York"))
              d = now.date()
              if now.hour * 60 + now.minute < 16 * 60 + 20:
                  d -= timedelta(days=1)
              while d.weekday() >= 5:
                  d -= timedelta(days=1)
              return d.isoformat()
          want = expected_session()
          for attempt in range(1, 7):
              subprocess.run([sys.executable, "fetch_data.py", "--out", "out"], check=True)
              got = json.load(open("out/manifest.json"))["prices"]["as_of"]
              print(f"attempt {attempt}: as_of={got} expected={want}", flush=True)
              if got >= want or attempt == 6:
                  if got < want:
                      print("::warning::前営業日の足がまだ入っていません（Yahoo未確定か休場日）。前回までの足で進みます。")
                  break
              time.sleep(600)
          PY

      - name: Do not go backwards
        # 取得に失敗して前回より古いデータになった場合は公開しない（前回のデータを残す）
        run: |
          python - <<'PY'
          import json, os, sys
          new = json.load(open("out/manifest.json"))["prices"]["as_of"]
          p = "out/prev/manifest.json"
          old = json.load(open(p))["prices"]["as_of"] if os.path.exists(p) and os.path.getsize(p) > 0 else ""
          print(f"previous as_of={old} new as_of={new}")
          sys.exit(1 if old and new < old else 0)
          PY

      - name: Analyze
        run: python analyze.py --out out --prev-ledger out/prev/ledger.json --prev-screen out/prev/screen.csv --prev-history out/prev/history_signals.csv --history-seed history_seed.csv

      - name: Publish to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -rf prev
          git init -q
          git checkout -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
